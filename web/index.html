  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --water:#1A2142; --park:#172120; --building:#1C1A31; --road:#2A2743; --road-casing:#1E1C35; --rail:#2E2B47; --map-label:#8B87A6; --ctrl-filter:invert(1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:grid;grid-template-columns:400px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-scroll{overflow-y:auto;flex:1;min-height:0;padding:0 max(20px,env(safe-area-inset-left,0px)) 24px 20px}
.mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:46vh auto}
  .mapwrap{grid-row:1;height:46vh}
  .side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .side-scroll{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 16px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff}
.logo-mark svg{width:17px;height:17px}
.logo b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.source{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:5px 10px 5px 8px;border-radius:999px}
.source i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.source[data-kind="sample"] i{background:var(--purple)}
.source[data-kind="otp"] i,.source[data-kind="live"] i{background:#2BB58B}
.source:hover{color:var(--ink)}

/* Search */
.search{display:grid;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.places{position:relative;display:grid;gap:8px}
.place{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:10px;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:0 12px;height:48px}
.place:focus-within{border-color:var(--purple);background:var(--panel)}
.place .pin{width:10px;height:10px;border-radius:50%;justify-self:center}
.place .pin.a{border:2.5px solid var(--ink)}
.place .pin.b{background:var(--grad)}
.place select{appearance:none;-webkit-appearance:none;border:0;background:transparent;width:100%;height:100%;font-weight:600;font-size:15px;min-width:0;cursor:pointer;padding-right:36px;text-overflow:ellipsis}
.place select:focus{outline:none}
.swap{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.swap:hover{color:var(--ink)}
.swap svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:11px;padding:3px;flex:1;min-width:0}
.seg button{height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(23,20,43,.12)}
.modes{display:flex;gap:6px}
.mode{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:transparent;background:color-mix(in srgb,var(--purple) 12%,var(--panel));color:var(--purple)}
.mode svg{width:16px;height:16px}

/* Results */
.res-head{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 10px}
.res-head h2{margin:0;font-size:15px;font-weight:700}
.res-head span{font-size:12px;color:var(--faint)}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.notice b{color:var(--ink);font-weight:600}
.notice button{color:var(--purple);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.list{display:grid;gap:10px}
.card{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:left;width:100%;display:block}
.card-main{display:grid;gap:10px;padding:14px 14px 14px 16px;width:100%;text-align:left}
.card[aria-current="true"]{border-color:transparent;box-shadow:var(--shadow)}
.card[aria-current="true"]::before{content:"";position:absolute;inset:0;border-radius:var(--r);padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dur{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.dur small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.risk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.risk.none{--c:var(--faint)}
.legs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.leg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:7px;background:var(--soft);font-size:12px;font-weight:600;color:var(--ink)}
.leg svg{width:14px;height:14px}
.leg.route{color:#fff}
.legs .sep{color:var(--faint);font-size:11px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.pick{background:var(--grad);color:#fff}
.more{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:14px}
.why{margin:0;font-size:14px;line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--soft);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.fact span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block}
.compare{font-size:12.5px;color:var(--muted)}
.compare b{color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:7px 0;position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.steps .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--ink);position:relative;z-index:1}
.steps .ic svg{width:15px;height:15px}
.steps .ic.route{color:#fff}
.steps b{display:block;font-size:13.5px;font-weight:600}
.steps span{font-size:12.5px;color:var(--muted)}
.steps time{font-size:12px;color:var(--faint);font-family:var(--mono);padding-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;font-weight:700;font-size:14.5px;padding:0 18px}
.btn.primary{background:var(--grad);color:#fff;width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn svg{width:17px;height:17px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.foot{display:flex;justify-content:space-between;gap:12px;padding-top:18px;font-size:12px;color:var(--faint)}
.foot button{color:var(--muted);font-weight:600}
.foot button:hover{color:var(--ink)}
.skeleton{height:96px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skeleton{animation:sh 1.2s infinite linear}@keyframes sh{to{background-position:-200% 0}}}

/* Map overlays */
.ov{position:absolute;z-index:500;display:flex;gap:8px}
.ov-tl{top:calc(14px + env(safe-area-inset-top,0px));left:14px}
.ov-tr{top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow);font-size:12.5px;font-weight:700;color:var(--ink)}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="false"]{color:var(--muted)}
.sos{color:#fff;background:#D93A6B}
.sos span{font-weight:500;opacity:.9}
@media (max-width:860px){.sos span{display:none}}
.legend{position:absolute;z-index:500;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.maplibregl-map{font-family:var(--font)}
.maplibregl-ctrl-group{border-radius:10px!important;box-shadow:var(--shadow)!important;overflow:hidden;background:var(--panel)!important}
.maplibregl-ctrl-group button{background-color:var(--panel)!important}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-icon{filter:var(--ctrl-filter)}
.maplibregl-ctrl-attrib{font-size:10px;background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-attrib-button{filter:var(--ctrl-filter)}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-family:var(--font)}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{border-top-color:var(--panel)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip,.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,.maplibregl-popup-anchor-top-right .maplibregl-popup-tip{border-bottom-color:var(--panel)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--panel)}
.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--panel)}
.pop{display:grid;gap:8px}
.pop-note{font-size:12px;color:var(--muted)}
.pop-row{display:flex;gap:6px}
.mk{width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--faint);cursor:pointer}
.mk span{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);white-space:nowrap;font:600 11.5px var(--font);color:var(--muted);
  text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 4px var(--halo);pointer-events:none}
.mk-from{width:16px;height:16px;border:4px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mk-to{width:18px;height:18px;border:3px solid var(--panel);background:var(--grad);box-shadow:0 1px 6px rgba(0,0,0,.3)}
.mk-from span,.mk-to span{color:var(--ink);font-weight:700;font-size:12.5px}
.mk-stop{width:12px;height:12px;border:3px solid var(--c);cursor:default}
.mk-stop span{opacity:0;transition:opacity .15s}
.mk-stop:hover span{opacity:1}
.mk-trip{width:20px;height:20px;border:3px solid #fff;background:var(--purple);box-shadow:0 0 0 6px color-mix(in srgb,var(--purple) 25%,transparent),0 2px 8px rgba(0,0,0,.3);cursor:default}
@media (prefers-reduced-motion:no-preference){.mk-trip{animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--purple) 0%,transparent),0 2px 8px rgba(0,0,0,.3)}}}
.pop button{height:32px;border-radius:9px;background:var(--soft);font-weight:600;font-size:13px;padding:0 12px}

/* Trip HUD */
.hud{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));background:var(--panel);border-radius:18px;box-shadow:0 12px 40px rgba(23,20,43,.22);padding:14px;display:grid;gap:12px}
.hud-top{display:flex;gap:12px;align-items:center}
.hud-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft);flex:none}
.hud-ic svg{width:21px;height:21px}
.hud-ic.route{color:#fff}
.hud-txt{flex:1;min-width:0}
.hud-txt b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.hud-txt span{font-size:12.5px;color:var(--muted)}
.hud-eta{text-align:right;font-variant-numeric:tabular-nums}
.hud-eta b{display:block;font-size:17px;font-weight:800}
.hud-eta span{font-size:11.5px;color:var(--muted)}
.bar{height:5px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);border-radius:99px}
.hud-actions{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px}
.hud-actions .btn{height:40px;font-size:13.5px;padding:0 14px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:1000;background:rgba(14,12,30,.42);display:grid;place-items:center;padding:16px}
@media (max-width:860px){.scrim{align-items:end}}
.sheet{background:var(--panel);border-radius:20px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(14,12,30,.3);margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sheet p{margin:0;color:var(--muted);font-size:13.5px}
.sheet .x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13.5px}
.choice[aria-pressed="true"]{border-color:var(--purple);background:color-mix(in srgb,var(--purple) 10%,var(--panel));color:var(--purple)}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=url],.field textarea{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--soft);padding:0 12px;width:100%}
.field textarea{height:76px;padding:10px 12px;resize:vertical}
.status-line{font-size:12.5px;color:var(--muted);min-height:18px}
.status-line.ok{color:#1F9D74}.status-line.err{color:#D93A6B}
.stars{display:flex;gap:8px}
.star{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--faint)}
.star svg{width:22px;height:22px}
.star[aria-pressed="true"]{color:#fff;background:var(--grad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.code{font-family:var(--mono);font-size:11.5px;background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink)}
.toast{position:fixed;z-index:1100;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--panel);font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.mode,.seg button,.chip{transition:background .15s,color .15s,box-shadow .15s,border-color .15s}}
</style>

<div class="app">
  <aside class="side" aria-label="Plan a trip">
    <div class="side-scroll">

<script type="text/plain" id="plan-query">
query AthenaPlan(
  $origin: PlanLabeledLocationInput!
  $destination: PlanLabeledLocationInput!
  $dateTime: PlanDateTimeInput
  $modes: PlanModesInput
  $preferences: PlanPreferencesInput
  $first: Int
) {
  planConnection(
    origin: $origin
    destination: $destination
    dateTime: $dateTime
    modes: $modes
    preferences: $preferences
    first: $first
  ) {
    searchDateTime
    routingErrors {
      code
      description
    }
    edges {
      node {
        start
        end
        duration
        walkDistance
        walkTime
        waitingTime
        numberOfTransfers
        generalizedCost
        legs {
          mode
          duration
          distance
          transitLeg
          headsign
          start {
            scheduledTime
          }
          end {
            scheduledTime
          }
          from {
            name
            lat
            lon
          }
          to {
            name
            lat
            lon
          }
          route {
            shortName
            longName
            color
            textColor
          }
          legGeometry {
            points
          }
          steps {
            streetName
            distance
            relativeDirection
            lat
            lon
          }
        }
      }
    }
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(() => {
"use strict";
// ============================================================ constants
const BANDS = [{id:"18",label:"6:00 pm"},{id:"22",label:"10:00 pm"},{id:"01",label:"1:00 am"}];
const MODES = [{id:"transit",label:"Transit",icon:"transit"},{id:"bike",label:"Bike",icon:"bike"},{id:"walk",label:"Walk",icon:"walk"}];
const MODE_META = {
  WALK:{icon:"walk",verb:"Walk",label:"Walk"}, BICYCLE:{icon:"bike",verb:"Ride",label:"Bike"},
  BUS:{icon:"bus",verb:"Bus",label:"Bus"}, TRAM:{icon:"tram",verb:"Light rail",label:"Light rail"},
  RAIL:{icon:"train",verb:"Train",label:"Train"}, SUBWAY:{icon:"train",verb:"Metro",label:"Metro"},
  FERRY:{icon:"ferry",verb:"Ferry",label:"Ferry"}, COACH:{icon:"bus",verb:"Coach",label:"Coach"}
};
const TRANSIT_COLOR = {BUS:"#4677EE",TRAM:"#8657F0",RAIL:"#E5539A",SUBWAY:"#8657F0",FERRY:"#4677EE",COACH:"#4677EE"};
const QUERY = document.getElementById("plan-query").textContent.trim();
const SYD = "Australia/Sydney";

// ============================================================ state
const store = {
  get(k,d){try{const v=localStorage.getItem("athena:"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("athena:"+k,JSON.stringify(v));}catch(e){}}
};
const S = {
  routes:null, streets:null, idx:null, places:[], placeById:{},
  from:store.get("from","unsw"), to:store.get("to","townhall"),
  band:store.get("band","22"), modes:new Set(store.get("modes",["transit","bike"])),
  live:false, otpUrl:store.get("otpUrl","http://localhost:8080"), liveCache:{},
  list:[], sel:null, layer:true, trip:null, loading:false, lastMs:null, error:null, custom:{}
};

// ============================================================ helpers
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit",timeZone:SYD}).replace(" "," ").toLowerCase() : "";
const mins = s => Math.max(1, Math.round(s/60));
const fmtDist = m => m>=1000 ? (m/1000).toFixed(1)+" km" : Math.round(m/10)*10+" m";
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function decode(str){ // Google encoded polyline -> [[lat,lon]]
  const out=[]; let i=0,lat=0,lon=0;
  while(i<str.length){
    for(const k of [0,1]){
      let b,shift=0,res=0;
      do{b=str.charCodeAt(i++)-63;res|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);
      const d=(res&1)?~(res>>1):(res>>1);
      if(k===0)lat+=d;else lon+=d;
    }
    out.push([lat/1e5,lon/1e5]);
  }
  return out;
}
function hav(a,b){const R=6371000,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

// Sydney date handling for live queries (mirrors plan_trips.py)
function sydneyParts(d){const f=new Intl.DateTimeFormat("en-CA",{timeZone:SYD,year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const p=Object.fromEntries(f.formatToParts(d).map(x=>[x.type,x.value]));return p;}
function nextWeeknight(){let d=new Date(Date.now()+864e5);for(let i=0;i<7;i++){const p=sydneyParts(d);if(!["Fri","Sat","Sun"].includes(p.weekday))return `${p.year}-${p.month}-${p.day}`;d=new Date(d.getTime()+864e5);}return sydneyParts(new Date()).year+"-01-01";}
function sydneyOffset(dateStr,hour){
  const guess=new Date(`${dateStr}T${String(hour).padStart(2,"0")}:00:00Z`);
  try{const p=new Intl.DateTimeFormat("en-US",{timeZone:SYD,timeZoneName:"shortOffset"}).formatToParts(guess).find(x=>x.type==="timeZoneName").value;
    const m=p.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);if(m)return `${m[1]}${m[2].padStart(2,"0")}:${m[3]||"00"}`;}catch(e){}
  const mo=+dateStr.slice(5,7);return (mo>=10||mo<=3)?"+11:00":"+10:00";
}
function departureISO(band){const date=S.routes?.date&&!S.live?S.routes.date:nextWeeknight();const h=+band;
  let d=date;if(h<6){const t=new Date(date+"T12:00:00Z");t.setUTCDate(t.getUTCDate()+1);d=t.toISOString().slice(0,10);}
  return `${d}T${String(h).padStart(2,"0")}:00:00${sydneyOffset(d,h)}`;}

function otpVariables(o,d,when,mode,variant,first=3){ // keep identical to plan_trips.variables()
  const safe=variant==="athena";const prefs={street:{walk:{safetyFactor:safe?1.0:0.0}}};let modes;
  if(mode==="transit")modes={direct:["WALK"]};
  else if(mode==="bike"){modes={directOnly:true,direct:["BICYCLE"]};prefs.street.bicycle={optimization:safe?{triangle:{safety:0.7,flatness:0.1,time:0.2}}:{type:"SHORTEST_DURATION"}};}
  else modes={directOnly:true,direct:["WALK"]};
  const loc=p=>({label:p.name,location:{coordinate:{latitude:p.lat,longitude:p.lon}}});
  return {origin:loc(o),destination:loc(d),dateTime:{earliestDeparture:when},modes,preferences:prefs,first};
}

// ============================================================ street index + scoring
function buildIndex(gj){
  if(!gj||!gj.features)return null;
  const lat0=-33.9, mx=111320*Math.cos(lat0*Math.PI/180), my=110540, cell=60;
  const segs=[], grid=new Map();
  gj.features.forEach((f,fi)=>{
    const g=f.geometry;if(!g)return;
    const lines=g.type==="LineString"?[g.coordinates]:g.type==="MultiLineString"?g.coordinates:[];
    for(const c of lines)for(let i=0;i<c.length-1;i++){
      const ax=c[i][0]*mx,ay=c[i][1]*my,bx=c[i+1][0]*mx,by=c[i+1][1]*my;
      const si=segs.length;segs.push([ax,ay,bx,by,fi]);
      const x0=Math.floor(Math.min(ax,bx)/cell),x1=Math.floor(Math.max(ax,bx)/cell),y0=Math.floor(Math.min(ay,by)/cell),y1=Math.floor(Math.max(ay,by)/cell);
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){const k=x+","+y;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(si);}
    }
  });
  function nearest(lat,lon,maxD){
    const px=lon*mx,py=lat*my,kx=Math.floor(px/cell),ky=Math.floor(py/cell),span=Math.ceil(maxD/cell);
    let best=null,bd=maxD*maxD;
    for(let x=kx-span;x<=kx+span;x++)for(let y=ky-span;y<=ky+span;y++){
      const a=grid.get(x+","+y);if(!a)continue;
      for(const si of a){const [ax,ay,bx,by,fi]=segs[si];const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
        let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=Math.max(0,Math.min(1,t));
        const ex=ax+t*dx-px,ey=ay+t*dy-py,d2=ex*ex+ey*ey;if(d2<bd){bd=d2;best=fi;}}
    }
    return best===null?null:gj.features[best].properties;
  }
  return {nearest};
}

function legCoords(leg){return leg.legGeometry?.points?decode(leg.legGeometry.points):[[leg.from.lat,leg.from.lon],[leg.to.lat,leg.to.lon]];}

function scoreItinerary(it,band){
  const idx=S.idx, key="risk_"+band, vkey="venues_"+band;
  const street={len:0,known:0,lit:0,riskLen:0}, named=new Map(), venueSeen=new Set();
  let streetSec=0,transitSec=0,waitSec=0,waitWorst=null;
  let prevEnd=new Date(it.start).getTime();
  for(const leg of it.legs){
    const st=new Date(leg.start.scheduledTime).getTime();
    const gap=Math.max(0,(st-prevEnd)/1000);
    if(gap>0 && leg.transitLeg){waitSec+=gap;const p=idx&&idx.nearest(leg.from.lat,leg.from.lon,80);
      const r=p&&p[key]!=null?p[key]:0.4;const w={stop:leg.from.name,sec:gap,risk:r};if(!waitWorst||gap*r>waitWorst.sec*waitWorst.risk)waitWorst=w;}
    prevEnd=new Date(leg.end.scheduledTime).getTime();
    if(leg.transitLeg){transitSec+=leg.duration;continue;}
    streetSec+=leg.duration;
    const pts=legCoords(leg);let legRisk=0,legLen=0;
    for(let i=0;i<pts.length-1;i++){
      const d=hav(pts[i],pts[i+1]),n=Math.max(1,Math.round(d/15));
      for(let j=0;j<n;j++){const t=(j+.5)/n,lat=pts[i][0]+(pts[i+1][0]-pts[i][0])*t,lon=pts[i][1]+(pts[i+1][1]-pts[i][1])*t,step=d/n;
        street.len+=step;legLen+=step;const p=idx&&idx.nearest(lat,lon,30);
        if(p&&p[key]!=null){street.known+=step;if(p.lit==="yes")street.lit+=step;legRisk+=p[key]*step;
          const nm=p.name||"an unnamed path";const e=named.get(nm)||{len:0,risk:p[key],lit:p.lit,tunnel:!!p.tunnel};e.len+=step;e.risk=Math.max(e.risk,p[key]);named.set(nm,e);
          if(!venueSeen.has(p.id)){venueSeen.add(p.id);street.venues=(street.venues||0)+(p[vkey]||0);}}
        else legRisk+=0.5*step;
      }
    }
    street.riskLen+=legRisk;
  }
  if(!idx)return {risk:null,confidence:null,litShare:null,venues:null,waitMin:Math.round(waitSec/60),worst:null,reason:null};
  const known=street.len?street.known/street.len:1;
  const streetRisk=street.len?street.riskLen/street.len:0;
  const total=Math.max(1,streetSec+transitSec+waitSec);
  const waitRisk=waitWorst?waitWorst.risk:0;
  const exposure=(streetRisk*streetSec+0.12*transitSec+waitRisk*waitSec)/total;
  let worst=null;for(const [nm,e] of named)if(e.len>=60&&(!worst||e.risk>worst.risk))worst={name:nm,...e};
  const peak=Math.max(worst?worst.risk:0, waitSec>=480?waitRisk:0);
  const risk=Math.min(1,0.55*exposure+0.45*peak);
  const conf=known>=0.8?"High":known>=0.5?"Medium":"Low";
  const litShare=street.known?street.lit/street.known:null;
  const r={risk,confidence:band==="01"&&conf==="High"?"Medium":conf,litShare,venues:street.venues||0,waitMin:Math.round(waitSec/60),
    worst,waitWorst,streetMin:Math.round(streetSec/60),known};
  r.reason=explain(it,r);
  return r;
}

function explain(it,s){ // plain-English summary from the facts only; never calls a route "safe"
  const parts=[];
  const hasStreet=s.streetMin>0;
  if(hasStreet&&s.litShare!=null){
    if(s.litShare>=0.9)parts.push("Lit streets almost the whole way");
    else if(s.litShare>=0.65)parts.push(`Mostly lit streets (${Math.round(s.litShare*100)}%)`);
    else parts.push(`Only ${Math.round(s.litShare*100)}% of the walk or ride is on lit streets`);
  }
  if(s.worst&&s.worst.risk>=0.5){
    const w=s.worst;
    if(w.tunnel)parts.push(`the ${w.name} is quiet at this hour`);
    else if(w.lit==="no")parts.push(`${fmtDist(w.len)} on ${w.name}, which is dark and empty at this hour`);
    else parts.push(`${w.name} is quiet at this hour`);
  }
  let first=parts.length>1?`${parts[0]}, but ${parts.slice(1).join(" and ")}.`:parts.length?parts[0]+".":"";
  const extra=[];
  if(s.waitWorst&&s.waitMin>=7)extra.push(`Expect about ${s.waitMin} minutes waiting at ${s.waitWorst.stop}.`);
  if(s.venues>=15)extra.push(`Busy route, with about ${s.venues} places open nearby.`);
  else if(hasStreet&&s.venues<=2&&!(s.worst&&s.worst.risk>=0.5))extra.push("Few places are open along the way.");
  if(!hasStreet)extra.push("Almost all of this trip is on board.");
  if(s.confidence==="Low")extra.push("We have little street data for parts of this route.");
  return [first,...extra].filter(Boolean).join(" ");
}

const bandOf=r=>r==null?{k:"none",t:"Not scored",c:"var(--faint)"}:r<0.3?{k:"low",t:"Lower risk",c:"var(--risk-low)"}:r<0.5?{k:"mid",t:"Moderate risk",c:"var(--risk-mid)"}:{k:"high",t:"Higher risk",c:"var(--risk-high)"};

// ============================================================ combine OTP answers
function signature(it){return it.legs.map(l=>l.mode+":"+(l.route?.shortName||"")+":"+(l.legGeometry?.points||"").length+":"+Math.round(l.duration/60)).join("|");}
function buildList(entry){
  const seen=new Map();
  for(const mode of MODES.map(m=>m.id)){
    if(!S.modes.has(mode)||!entry[mode])continue;
    for(const variant of ["athena","fastest"]){
      const res=entry[mode][variant];if(!res)continue;
      for(const it of res.itineraries||[]){
        if(mode==="transit"&&!it.legs.some(l=>l.transitLeg))continue; // walk-only answers belong to Walk
        const sig=signature(it);let e=seen.get(sig);
        if(!e){e={id:"r"+seen.size,it,mode,found:new Set()};seen.set(sig,e);}
        e.found.add(variant);
      }
    }
  }
  const list=[...seen.values()];
  for(const e of list){e.score=scoreItinerary(e.it,S.band);e.dur=e.it.duration;}
  if(!list.length)return list;
  const fastest=list.reduce((a,b)=>b.dur<a.dur?b:a);fastest.fastest=true;
  const scored=list.filter(e=>e.score.risk!=null);
  if(scored.length){
    const limit=fastest.dur*1.5+600;
    const cand=scored.filter(e=>e.dur<=limit).sort((a,b)=>a.score.risk-b.score.risk||a.dur-b.dur);
    if(cand.length)cand[0].pick=true;
    list.sort((a,b)=>(b.pick|0)-(a.pick|0)||a.score.risk-b.score.risk||a.dur-b.dur);
  } else list.sort((a,b)=>a.dur-b.dur);
  for(const e of list)e.base=fastest;
  return list;
}

// ============================================================ data loading
async function fetchJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error(url+" "+r.status);return r.json();}
async function loadSaved(){
  const [routes,streets]=await Promise.allSettled([fetchJSON("routes.json"),fetchJSON("streets.geojson")]);
  if(routes.status==="fulfilled")setRoutes(routes.value);
  if(streets.status==="fulfilled")setStreets(streets.value);
  if(routes.status!=="fulfilled")S.error="Couldn't load routes.json. Open the page through a web server (python -m http.server) or import the file.";
}
function setRoutes(r){S.routes=r;S.places=r.places||[];S.placeById=Object.fromEntries(S.places.map(p=>[p.id,p]));
  if(!S.placeById[S.from])S.from=S.places[0]?.id;if(!S.placeById[S.to])S.to=S.places[1]?.id;}
function setStreets(gj){S.streets=gj;S.idx=buildIndex(gj);drawStreets();}

async function liveEntry(){
  const o=placeOf(S.from),d=placeOf(S.to);if(!o||!d)return null;
  const key=[S.from,S.to,S.band,[...S.modes].sort().join(","),o.lat,o.lon,d.lat,d.lon].join("|");
  if(S.liveCache[key])return S.liveCache[key];
  const when=departureISO(S.band),url=S.otpUrl.replace(/\/$/,"")+"/otp/gtfs/v1";
  const entry={departure:when};const jobs=[];const t0=performance.now();
  for(const mode of S.modes){entry[mode]={};for(const variant of ["fastest","athena"]){
    jobs.push(fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:QUERY,variables:otpVariables(o,d,when,mode,variant)})})
      .then(r=>{if(!r.ok)throw new Error("OTP answered "+r.status);return r.json();})
      .then(b=>{if(b.errors)throw new Error(b.errors[0]?.message||"GraphQL error");const pc=b.data.planConnection;
        entry[mode][variant]={itineraries:(pc.edges||[]).map(e=>e.node),errors:pc.routingErrors||[]};}));}}
  await Promise.all(jobs);
  S.lastMs=Math.round(performance.now()-t0);entry.ms=S.lastMs;
  S.liveCache[key]=entry;return entry;
}
function placeOf(id){return S.custom[id]||S.placeById[id];}

// ============================================================ map (MapLibre GL, OpenFreeMap vector tiles)
const LOCAL=["localhost","127.0.0.1"].includes(location.hostname)||location.protocol==="file:";
const BASEMAP="https://tiles.openfreemap.org/styles/positron";
const EMPTY={type:"FeatureCollection",features:[]};
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ll=p=>[p[1],p[0]]; // [lat,lon] -> [lon,lat]
let map,mapReady=false,basemap=false,placeMarkers=[],stopMarkers=[],tripMarker=null,drawnStreets=null,boundHandlers=false;
function blankStyle(){return {version:8,sources:{},layers:[{id:"background",type:"background",paint:{"background-color":cssVar("--map")}}]};}
function initMap(){
  basemap=LOCAL;
  map=new maplibregl.Map({container:"map",style:basemap?BASEMAP:blankStyle(),center:[151.218,-33.895],zoom:13.2,
    attributionControl:false,dragRotate:false,pitchWithRotate:false,fadeDuration:0});
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:basemap?
    '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>':
    "Streets © OpenStreetMap contributors"}),"bottom-right");
  let fellBack=false;
  const fallback=()=>{if(fellBack||mapReady)return;fellBack=true;basemap=false;map.setStyle(blankStyle());};
  if(basemap){setTimeout(fallback,7000);map.on("error",()=>{if(!mapReady)fallback();});}
  map.on("style.load",()=>{mapReady=true;drawnStreets=null;setupLayers();});
  map.on("click",onMapClick);
}
function tintBasemap(){
  const c={bg:cssVar("--map"),water:cssVar("--water"),park:cssVar("--park"),bld:cssVar("--building"),road:cssVar("--road"),
    casing:cssVar("--road-casing"),rail:cssVar("--rail"),label:cssVar("--map-label"),halo:cssVar("--map")};
  for(const l of map.getStyle().layers){
    const id=l.id.toLowerCase(),set=(k,v)=>{try{map.setPaintProperty(l.id,k,v);}catch(e){}};
    if(l.type==="background")set("background-color",c.bg);
    else if(l.type==="fill"){
      if(/water|ocean|lake|river/.test(id))set("fill-color",c.water);
      else if(/park|wood|grass|forest|landcover|green|cemetery|pitch|garden/.test(id))set("fill-color",c.park);
      else if(/building/.test(id))set("fill-color",c.bld);
      else set("fill-color",c.bg);
    } else if(l.type==="line"){
      if(/water|river|stream|canal/.test(id))set("line-color",c.water);
      else if(/rail|transit/.test(id))set("line-color",c.rail);
      else if(/casing|boundary|admin/.test(id))set("line-color",c.casing);
      else set("line-color",c.road);
    } else if(l.type==="symbol"){set("text-color",c.label);set("text-halo-color",c.halo);set("icon-opacity",0.5);}
    else if(l.type==="fill-extrusion")set("fill-extrusion-color",c.bld);
  }
}
function setupLayers(){
  if(basemap)tintBasemap();
  const before=(map.getStyle().layers.find(l=>l.type==="symbol")||{}).id;
  for(const s of ["streets","alts","sel"])if(!map.getSource(s))map.addSource(s,{type:"geojson",data:EMPTY});
  const round={"line-cap":"round","line-join":"round"};
  const add=(spec,b=before)=>{if(!map.getLayer(spec.id))map.addLayer(spec,b);};
  add({id:"streets-lit",type:"line",source:"streets",filter:["!=",["get","lit"],"no"],layout:round,
    paint:{"line-width":["interpolate",["linear"],["zoom"],12,1.2,16,5],"line-opacity":.5}});
  add({id:"streets-unlit",type:"line",source:"streets",filter:["==",["get","lit"],"no"],layout:{"line-cap":"butt"},
    paint:{"line-width":["interpolate",["linear"],["zoom"],12,1.2,16,4],"line-opacity":.75,"line-dasharray":[1.5,1.5]}});
  add({id:"alts-line",type:"line",source:"alts",filter:["!=",["get","walk"],true],layout:round,paint:{"line-color":["get","color"],"line-width":3,"line-opacity":.28}});
  add({id:"alts-walk",type:"line",source:"alts",filter:["==",["get","walk"],true],layout:round,paint:{"line-color":["get","color"],"line-width":2.5,"line-opacity":.3,"line-dasharray":[0.4,2]}});
  add({id:"alts-hit",type:"line",source:"alts",paint:{"line-color":"#000","line-width":16,"line-opacity":0}});
  add({id:"sel-halo",type:"line",source:"sel",layout:round,paint:{"line-color":cssVar("--halo"),"line-width":["case",["get","walk"],8,11],"line-opacity":.95}});
  add({id:"sel-line",type:"line",source:"sel",filter:["!=",["get","walk"],true],layout:round,paint:{"line-color":["get","color"],"line-width":6}});
  add({id:"sel-walk",type:"line",source:"sel",filter:["==",["get","walk"],true],layout:round,paint:{"line-color":["get","color"],"line-width":4,"line-dasharray":[0.2,1.6]}});
  if(!boundHandlers){boundHandlers=true;
    map.on("mouseenter","alts-hit",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","alts-hit",()=>map.getCanvas().style.cursor="");}
  drawStreets();drawPlaces();drawRoutes(true);
}
function riskExpr(){const k="risk_"+S.band;
  return ["case",["==",["typeof",["get",k]],"number"],["step",["get",k],cssVar("--risk-low"),0.3,cssVar("--risk-mid"),0.5,cssVar("--risk-high")],cssVar("--street")];}
function drawStreets(){
  if(!mapReady)return;
  if(drawnStreets!==S.streets){map.getSource("streets")?.setData(S.streets||EMPTY);drawnStreets=S.streets;}
  const vis=S.layer&&S.streets?"visible":"none";
  for(const id of ["streets-lit","streets-unlit"])if(map.getLayer(id)){map.setLayoutProperty(id,"visibility",vis);map.setPaintProperty(id,"line-color",riskExpr());}
  renderLegend();
}
function renderLegend(){
  const el=$("legend");if(!S.streets||!S.layer||S.trip){el.hidden=true;return;}
  el.hidden=false;el.innerHTML=`<span><i style="background:var(--risk-low)"></i>Lower</span><span><i style="background:var(--risk-mid)"></i>Moderate</span><span><i style="background:var(--risk-high)"></i>Higher</span><span><i style="background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 7px);height:3px"></i>Unlit</span>`;
}
function markerEl(cls,label){const el=document.createElement("div");el.className="mk "+cls;
  if(label){const s=document.createElement("span");s.textContent=label;el.appendChild(s);}return el;}
function drawPlaces(){
  if(!map)return;placeMarkers.forEach(m=>m.remove());placeMarkers=[];
  const all=[...S.places.map(p=>({...p,custom:false})),...Object.values(S.custom).map(p=>({...p,custom:true}))];
  for(const p of all){
    const role=p.id===S.from?"from":p.id===S.to?"to":"place";
    if(p.custom&&role==="place")continue;
    const el=markerEl("mk-"+role,p.name);
    el.addEventListener("click",ev=>{ev.stopPropagation();if(!S.trip)openPlacePopup([p.lat,p.lon],p.custom?null:p.id);});
    placeMarkers.push(new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([p.lon,p.lat]).addTo(map));
  }
}
function legColor(l){if(l.mode==="WALK")return cssVar("--walk");if(l.mode==="BICYCLE")return cssVar("--blue");
  return l.route?.color?"#"+l.route.color:TRANSIT_COLOR[l.mode]||cssVar("--purple");}
function legFeature(l,rid){return {type:"Feature",properties:{rid,walk:l.mode==="WALK",color:legColor(l)},geometry:{type:"LineString",coordinates:legCoords(l).map(ll)}};}
function drawRoutes(fit){
  if(!mapReady)return;
  const sel=S.list.find(e=>e.id===S.sel);
  map.getSource("alts").setData({type:"FeatureCollection",features:S.list.filter(e=>e!==sel).flatMap(e=>e.it.legs.map(l=>legFeature(l,e.id)))});
  map.getSource("sel").setData({type:"FeatureCollection",features:sel?sel.it.legs.map(l=>legFeature(l,sel.id)):[]});
  if(map.getLayer("sel-halo"))map.setPaintProperty("sel-halo","line-color",cssVar("--halo"));
  stopMarkers.forEach(m=>m.remove());stopMarkers=[];
  if(!sel)return;
  for(const l of sel.it.legs){if(!l.transitLeg)continue;
    for(const pl of [l.from,l.to]){const el=markerEl("mk-stop",pl.name);el.style.setProperty("--c",legColor(l));
      stopMarkers.push(new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([pl.lon,pl.lat]).addTo(map));}}
  if(fit){map.resize();const b=new maplibregl.LngLatBounds();sel.it.legs.forEach(l=>legCoords(l).forEach(p=>b.extend(ll(p))));
    const sm=window.innerWidth<860;
    map.fitBounds(b,{padding:sm?{top:70,bottom:90,left:28,right:28}:{top:90,bottom:90,left:80,right:80},maxZoom:16,duration:reduceMotion?0:700});}
}
function retheme(){
  if(!mapReady)return;
  if(basemap)tintBasemap();else if(map.getLayer("background"))map.setPaintProperty("background","background-color",cssVar("--map"));
  drawStreets();drawRoutes(false);
}
function onMapClick(e){
  if(S.trip)return;
  const hit=map.getLayer("alts-hit")?map.queryRenderedFeatures(e.point,{layers:["alts-hit"]}):[];
  if(hit.length){select(hit[0].properties.rid,true);return;}
  openPlacePopup([e.lngLat.lat,e.lngLat.lng],null);
}
function openPlacePopup(p,id){
  const canLive=S.live;
  const html=`<div class="pop">${id?`<b>${esc(placeOf(id).name)}</b>`:`<span class="pop-note">${canLive?"Dropped pin":"Pick a place from the list, or connect live OTP to plan from any point."}</span>`}
    ${(id||canLive)?`<div class="pop-row"><button data-act="from">Start here</button><button data-act="to">Go here</button></div>`:""}</div>`;
  const pop=new maplibregl.Popup({closeButton:false,offset:14,maxWidth:"240px"}).setLngLat([p[1],p[0]]).setHTML(html).addTo(map);
  pop.getElement().querySelectorAll("button").forEach(b=>b.onclick=()=>{
    let pid=id;
    if(!pid){pid="pin-"+b.dataset.act;S.custom[pid]={id:pid,name:b.dataset.act==="from"?"Your start":"Your destination",lat:p[0],lon:p[1]};}
    if(b.dataset.act==="from")S.from=pid;else S.to=pid;
    pop.remove();persist();refresh();});
}

// ============================================================ rendering
function renderControls(){
  const opts=sel=>{const list=[...S.places,...Object.values(S.custom)];
    return list.map(p=>{const avail=S.live||!S.routes||p.id.startsWith("pin-")||hasSaved(p.id,sel);
      return `<option value="${esc(p.id)}" ${avail?"":"disabled"}>${esc(p.name)}${avail?"":" · needs OTP"}</option>`;}).join("");};
  $("from").innerHTML=opts("from");$("to").innerHTML=opts("to");
  $("from").value=S.from;$("to").value=S.to;
  $("bands").innerHTML=BANDS.map(b=>`<button aria-pressed="${b.id===S.band}" data-band="${b.id}">${b.label}</button>`).join("");
  $("modes").innerHTML=MODES.map(m=>`<button class="mode" aria-pressed="${S.modes.has(m.id)}" data-mode="${m.id}">${icon(m.icon)}${m.label}</button>`).join("");
  const kind=S.live?"live":S.routes?.source==="otp"?"otp":"sample";
  $("source-btn").dataset.kind=kind;
  $("source-label").textContent=kind==="live"?"Live OTP":kind==="otp"?"OTP results":"Sample data";
}
function hasSaved(id,which){if(!S.routes)return false;return (S.routes.trips||[]).some(([a,b])=>which==="from"?a===id:b===id);}

function legChip(l){
  const m=MODE_META[l.mode]||{icon:"transit",label:l.mode};
  if(l.transitLeg){const c=l.route?.color?"#"+l.route.color:TRANSIT_COLOR[l.mode]||"var(--purple)";
    return `<span class="leg route" style="background:${c}">${icon(m.icon)}${esc(l.route?.shortName||m.label)}</span>`;}
  return `<span class="leg">${icon(m.icon)}${mins(l.duration)}</span>`;
}
function stepRows(e){
  const rows=[];
  for(const l of e.it.legs){const m=MODE_META[l.mode]||{icon:"transit",verb:l.mode};
    let title,sub;
    if(l.transitLeg){title=`${m.verb} ${esc(l.route?.shortName||"")} to ${esc(l.to.name)}`;sub=`From ${esc(l.from.name)}${l.headsign?` · towards ${esc(l.headsign)}`:""}`;}
    else{const streets=[...new Set((l.steps||[]).map(s=>s.streetName).filter(n=>n&&!/^(path|road|sidewalk|footway|service road|bike path)$/i.test(n)))].slice(0,3);
      title=`${m.verb} ${fmtDist(l.distance)} to ${esc(l.to.name)}`;sub=streets.length?"Via "+streets.map(esc).join(", "):`${mins(l.duration)} min`;}
    const c=l.transitLeg?(l.route?.color?"#"+l.route.color:TRANSIT_COLOR[l.mode]):null;
    rows.push(`<li><span class="ic ${c?"route":""}" ${c?`style="background:${c}"`:""}>${icon(m.icon)}</span><div><b>${title}</b><span>${sub}</span></div><time>${fmtTime(l.start.scheduledTime)}</time></li>`);}
  rows.push(`<li><span class="ic">${icon("pin")}</span><div><b>Arrive at ${esc(placeOf(S.to)?.name||"destination")}</b><span>${mins(e.it.duration)} min trip</span></div><time>${fmtTime(e.it.end)}</time></li>`);
  return rows.join("");
}
function renderList(){
  const n=$("list"),notice=$("notice");
  $("res-title").textContent=S.list.length?`${S.list.length} route${S.list.length>1?"s":""}`:"Routes";
  $("res-meta").textContent=S.live&&S.lastMs!=null?`OTP answered in ${S.lastMs} ms`:"Ranked by risk, then time";
  let note="";
  if(!S.live&&S.routes?.source==="sample")note=`<div class="notice">${icon("layers")}<div><b>Sample routes.</b> Hand-made in OpenTripPlanner's format so you can try the app. <button data-open="data">Connect OTP</button> for real ones.</div></div>`;
  if(!S.idx&&(S.routes||S.live))note+=`<div class="notice"><div><b>No street data loaded,</b> so routes are ranked by time only. Add streets.geojson from tag_streets.py.</div></div>`;
  notice.innerHTML=note;
  if(S.loading){n.innerHTML=`<div class="skeleton"></div><div class="skeleton"></div>`;return;}
  if(S.error){n.innerHTML=`<div class="empty"><b>Couldn't get routes</b>${esc(S.error)}</div>`;return;}
  if(!S.modes.size){n.innerHTML=`<div class="empty"><b>Choose a way to travel</b>Turn on Transit, Bike or Walk above.</div>`;return;}
  if(S.from===S.to){n.innerHTML=`<div class="empty"><b>Same start and destination</b>Pick a different place to go.</div>`;return;}
  if(!S.list.length){n.innerHTML=`<div class="empty"><b>No routes for this trip yet</b>${S.live?"OpenTripPlanner found nothing for this time. Try another time or way to travel.":"Add this trip to places.json and run plan_trips.py, or connect live OTP."}</div>`;return;}
  n.innerHTML=S.list.map(e=>{const s=e.score,b=bandOf(s.risk),open=e.id===S.sel;
    const tags=[e.pick?`<span class="tag pick">Athena pick</span>`:"",e.fastest?`<span class="tag">Fastest</span>`:"",s.confidence==="Low"?`<span class="tag">Little data</span>`:""].join("");
    const legs=e.it.legs.filter(l=>l.transitLeg||l.duration>=60||e.it.legs.length===1).map(legChip).join(`<span class="sep">›</span>`);
    let more="";
    if(open){
      const cmp=e.base&&e.base!==e&&s.risk!=null&&e.base.score.risk!=null?(()=>{const dm=Math.round((e.dur-e.base.dur)/60),dr=Math.round((1-s.risk/e.base.score.risk)*100);
        return `<div class="compare">Compared with the fastest route: <b>${dm>0?"+"+dm+" min":dm<0?dm+" min":"same time"}</b>, <b>${dr>=0?dr+"% lower":(-dr)+"% higher"} risk</b>.</div>`;})():e.fastest?`<div class="compare">This is the fastest route. Others are compared with it.</div>`:"";
      const facts=s.risk==null?"":`<div class="facts"><div class="fact"><b>${s.litShare==null?"–":Math.round(s.litShare*100)+"%"}</b><span>on lit streets</span></div><div class="fact"><b>${s.venues}</b><span>places open nearby</span></div><div class="fact"><b>${s.waitMin} min</b><span>waiting at stops</span></div></div>`;
      more=`<div class="more">${s.reason?`<p class="why">${esc(s.reason)}</p>`:""}${facts}${cmp}<ol class="steps">${stepRows(e)}</ol><button class="btn primary" data-start="${e.id}">${icon("play")}Start trip</button></div>`;
    }
    return `<div class="card" aria-current="${open}"><button class="card-main" data-sel="${e.id}" aria-expanded="${open}">
      <div class="card-top"><div><div class="dur">${mins(e.dur)}<small>min</small></div><div class="when">${fmtTime(e.it.start)} – ${fmtTime(e.it.end)}</div></div><span class="risk" style="--c:${b.c}">${b.t}</span></div>
      <div class="legs">${legs}</div>${tags?`<div class="tags">${tags}</div>`:""}</button>${more}</div>`;}).join("");
}
function renderFoot(){
  const r=S.routes;let t="";
  if(S.live)t=`Live · ${S.otpUrl.replace(/^https?:\/\//,"")}`;
  else if(r?.source==="otp")t=`OTP results from ${r.generated?.slice(0,10)||"?"} · avg ${r.stats?.avgMs??"?"} ms per call`;
  else if(r)t="Sample data";
  $("foot-meta").textContent=t;
}

async function refresh(fit=true){
  renderControls();drawPlaces();
  S.error=null;
  let entry=null;
  if(S.live){S.loading=true;renderList();
    try{entry=await liveEntry();}catch(err){S.error=liveErrorText(err);}
    S.loading=false;}
  else if(S.routes)entry=S.routes.results?.[`${S.from}|${S.to}|${S.band}`]||null;
  else if(!S.error)S.error="No route data loaded yet.";
  S.list=entry?buildList(entry):[];
  if(!S.list.find(e=>e.id===S.sel))S.sel=(S.list.find(e=>e.pick)||S.list[0])?.id||null;
  drawStreets();renderList();drawRoutes(fit);renderFoot();
}
function liveErrorText(err){
  const hosted=!["localhost","127.0.0.1"].includes(location.hostname)&&location.protocol!=="file:";
  return hosted?"This hosted page can't reach an OpenTripPlanner server on your computer. Open web/index.html from your laptop with python -m http.server, then use Live OTP there.":
    `OpenTripPlanner at ${S.otpUrl} didn't answer (${err.message}). Check it's running with your graph loaded.`;
}
function select(id,fromMap){S.sel=S.sel===id&&!fromMap?S.sel:id;renderList();drawRoutes(true);
  if(fromMap){const el=document.querySelector(`[data-sel="${id}"]`);el&&el.scrollIntoView({block:"nearest",behavior:"smooth"});}}
function persist(){store.set("from",S.from);store.set("to",S.to);store.set("band",S.band);store.set("modes",[...S.modes]);}

// ============================================================ trip simulation
function startTrip(id){
  const e=S.list.find(x=>x.id===id);if(!e)return;
  const legs=e.it.legs.map(l=>{const c=legCoords(l);let d=0;const cum=[0];for(let i=1;i<c.length;i++){d+=hav(c[i-1],c[i]);cum.push(d);}return {l,c,cum,len:d};});
  const total=e.it.duration;
  S.trip={e,legs,t:0,playing:true,last:performance.now(),speed:total/40}; // whole trip in ~40 seconds
  tripMarker?.remove();
  tripMarker=new maplibregl.Marker({element:markerEl("mk-trip"),anchor:"center"}).setLngLat(ll(legs[0].c[0])).addTo(map);
  $("hud").hidden=false;renderLegend();renderHud();requestAnimationFrame(tick);
  if(window.innerWidth<860)document.querySelector(".mapwrap").scrollIntoView({behavior:"smooth"});
}
function tripPosition(){
  const T=S.trip,start=new Date(T.e.it.start).getTime(),now=start+T.t*1000;
  for(let i=0;i<T.legs.length;i++){const L_=T.legs[i],a=new Date(L_.l.start.scheduledTime).getTime(),b=new Date(L_.l.end.scheduledTime).getTime();
    if(now<a)return {i,wait:true,pos:L_.c[0],frac:0,remain:(a-now)/1000};
    if(now<=b){const f=b>a?(now-a)/(b-a):1,dist=f*L_.len;let k=1;while(k<L_.cum.length&&L_.cum[k]<dist)k++;
      const p0=L_.c[k-1],p1=L_.c[Math.min(k,L_.c.length-1)],seg=(L_.cum[k]||dist)-L_.cum[k-1],t=seg?(dist-L_.cum[k-1])/seg:0;
      return {i,wait:false,pos:[p0[0]+(p1[0]-p0[0])*t,p0[1]+(p1[1]-p0[1])*t],frac:f,dist};}}
  const last=T.legs[T.legs.length-1];return {i:T.legs.length-1,done:true,pos:last.c[last.c.length-1],frac:1};
}
function tick(now){
  const T=S.trip;if(!T)return;
  if(T.playing){const dt=Math.min(.1,(now-T.last)/1000);T.t=Math.min(T.e.it.duration,T.t+dt*T.speed);}
  T.last=now;const p=tripPosition();tripMarker.setLngLat(ll(p.pos));
  const px=map.project(ll(p.pos)),box=map.getContainer();
  if(now>(T.easeUntil||0)&&(!T.followed||px.x<box.clientWidth*.2||px.x>box.clientWidth*.8||px.y<box.clientHeight*.15||px.y>box.clientHeight*.6)){
    map.easeTo({center:ll(p.pos),zoom:Math.max(map.getZoom(),15),duration:reduceMotion?0:800});T.followed=true;T.easeUntil=now+900;}
  renderHud(p);
  if(p.done){T.playing=false;renderHud(p);return;}
  requestAnimationFrame(tick);
}
function hudView(p){
  const T=S.trip,info=T.legs[p.i],L_=info.l,m=MODE_META[L_.mode]||{icon:"transit",verb:L_.mode};
  let title,sub,ic=m.icon,color=null;
  if(p.done){title=`You've arrived at ${esc(placeOf(S.to)?.name||"your destination")}`;sub="How did that feel? Your rating helps Athena learn.";ic="pin";}
  else if(p.wait){title=`Wait for ${esc(L_.route?.shortName||m.verb)} at ${esc(L_.from.name)}`;sub=`Due in ${Math.max(1,Math.round(p.remain/60))} min${L_.headsign?` · towards ${esc(L_.headsign)}`:""}. Wait somewhere lit, near the help point.`;}
  else if(L_.transitLeg){title=`On ${esc(L_.route?.shortName||m.verb)} to ${esc(L_.to.name)}`;sub=`Get off at ${esc(L_.to.name)} at ${fmtTime(L_.end.scheduledTime)}`;}
  else{let acc=0,cur=null;const steps=L_.steps||[];const scale=info.len&&L_.distance?info.len/L_.distance:1;
    for(const st of steps){acc+=(st.distance||0)*scale;if(acc>=(p.dist||0)){cur=st;break;}}
    const left=Math.max(0,info.len-(p.dist||0));title=`${m.verb} ${fmtDist(left)}${cur?.streetName?` on ${esc(cur.streetName)}`:""}`;sub=`Towards ${esc(L_.to.name)}`;}
  if(L_.transitLeg&&!p.done)color=L_.route?.color?"#"+L_.route.color:TRANSIT_COLOR[L_.mode];
  const total=T.e.it.duration;
  return {title,sub,ic,color,eta:p.done?0:Math.max(0,Math.round((total-T.t)/60)),pct:(T.t/total*100).toFixed(1),done:!!p.done};
}
function renderHud(p){
  const T=S.trip;if(!T)return;p=p||tripPosition();const v=hudView(p);const hud=$("hud");
  const shape=(v.done?"done":"run")+(T.playing?"1":"0");
  if(hud.dataset.shape!==shape){
    hud.dataset.shape=shape;
    hud.innerHTML=`<div class="hud-top"><span class="hud-ic" id="hud-ic"></span><div class="hud-txt"><b id="hud-title"></b><span id="hud-sub"></span></div>
      <div class="hud-eta"><b id="hud-eta"></b><span>arrive ${fmtTime(T.e.it.end)}</span></div></div>
      <div class="bar"><span id="hud-bar"></span></div>
      <div class="hud-actions">${v.done?`<button class="btn ghost" data-trip="close">Close</button><span></span><button class="btn primary" data-trip="rate">${icon("star")}Rate trip</button>`:
      `<button class="iconbtn" data-trip="toggle" aria-label="${T.playing?"Pause":"Play"} simulation">${icon(T.playing?"pause":"play")}</button><button class="btn ghost" data-trip="report">${icon("flag")}Report</button><button class="btn ghost" data-trip="end">End trip</button>`}</div>`;
    hud._last={};
  }
  const last=hud._last;
  const icKey=v.ic+(v.color||"");
  if(last.ic!==icKey){const el=$("hud-ic");el.className="hud-ic"+(v.color?" route":"");el.style.background=v.color||"";el.innerHTML=icon(v.ic);last.ic=icKey;}
  if(last.title!==v.title){$("hud-title").innerHTML=v.title;last.title=v.title;}
  if(last.sub!==v.sub){$("hud-sub").innerHTML=v.sub;last.sub=v.sub;}
  if(last.eta!==v.eta){$("hud-eta").textContent=v.eta+" min";last.eta=v.eta;}
  $("hud-bar").style.width=v.pct+"%";
}
function endTrip(rate){S.trip=null;tripMarker?.remove();tripMarker=null;$("hud").hidden=true;$("hud").dataset.shape="";renderLegend();if(rate)openRating();}

// ============================================================ sheets
function openSheet(html,setup){const s=$("scrim");s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;
  s.querySelector("[data-close]")?.addEventListener("click",closeSheet);setup&&setup(s);(s.querySelector("input,button:not([data-close])")||s.querySelector("button"))?.focus();}
function closeSheet(){$("scrim").hidden=true;$("scrim").innerHTML="";}
const sheetHead=t=>`<div class="sheet-head"><h3>${t}</h3><button class="x" data-close aria-label="Close">${icon("close")}</button></div>`;
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}

function openData(){
  const r=S.routes;
  openSheet(`${sheetHead("Route data")}
    <div class="choices" role="group" aria-label="Where routes come from"><button class="choice" aria-pressed="${!S.live}" data-src="saved">Saved routes</button><button class="choice" aria-pressed="${S.live}" data-src="live">Live OTP</button></div>
    <div id="src-saved" ${S.live?"hidden":""}>
      <dl class="kv"><dt>File</dt><dd>routes.json · ${r?.source==="otp"?"from OpenTripPlanner":"sample data"}</dd>
      <dt>Trips</dt><dd>${r?.trips?.length??0} trips × ${r?.bands?.length??0} times</dd>
      <dt>Streets</dt><dd>${S.streets?`${S.streets.features.length.toLocaleString()} scored streets${S.streets.source==="sample"?" (sample)":""}`:"not loaded"}</dd></dl>
      <p style="margin-top:10px">Make real files with <b>plan_trips.py</b> and <b>tag_streets.py</b>, then import them here or put them next to this page.</p>
      <div class="row" style="margin-top:12px"><label class="btn ghost" for="file-in" style="cursor:pointer">Import routes.json or streets.geojson</label><input id="file-in" type="file" accept=".json,.geojson,application/json" multiple hidden></div>
    </div>
    <div id="src-live" ${S.live?"":"hidden"}>
      <div class="field"><label for="otp-url">OpenTripPlanner address</label><input id="otp-url" type="url" value="${esc(S.otpUrl)}" spellcheck="false"></div>
      <p style="margin-top:8px">Each search asks OTP's GraphQL API twice per way of travelling: safety off (fastest) and safety on (Athena). Works when this page runs on the same computer as OTP.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="otp-connect" style="width:auto">Connect</button><span class="status-line" id="otp-status"></span></div>
    </div>`,s=>{
      s.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{const live=b.dataset.src==="live";s.querySelectorAll("[data-src]").forEach(x=>x.setAttribute("aria-pressed",x===b));
        s.querySelector("#src-saved").hidden=live;s.querySelector("#src-live").hidden=!live;if(!live&&S.live){S.live=false;refresh();}});
      s.querySelector("#file-in").onchange=async ev=>{for(const f of ev.target.files){try{const j=JSON.parse(await f.text());
        if(j.type==="FeatureCollection"){setStreets(j);toast(`Loaded ${j.features.length.toLocaleString()} streets`);}
        else if(j.results){setRoutes(j);toast(`Loaded ${j.trips?.length||0} trips from ${f.name}`);}
        else toast(`${f.name} isn't a routes.json or streets.geojson file`);}catch(e){toast(`Couldn't read ${f.name}`);}}
        S.live=false;closeSheet();refresh();};
      s.querySelector("#otp-connect").onclick=async()=>{const st=s.querySelector("#otp-status"),url=s.querySelector("#otp-url").value.trim().replace(/\/$/,"");
        st.className="status-line";st.textContent="Connecting…";
        try{const t0=performance.now();const r=await fetch(url+"/otp/gtfs/v1",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:"{ feeds { feedId } }"})});
          if(!r.ok)throw new Error(r.status);const b=await r.json();const feeds=(b.data?.feeds||[]).map(f=>f.feedId);
          S.otpUrl=url;store.set("otpUrl",url);S.live=true;S.liveCache={};
          if(!S.places.length&&S.routes===null){S.places=[];}
          st.className="status-line ok";st.textContent=`Connected in ${Math.round(performance.now()-t0)} ms · feeds: ${feeds.join(", ")||"none"}`;
          setTimeout(()=>{closeSheet();refresh();},600);
        }catch(err){st.className="status-line err";S.otpUrl=url;st.textContent=liveErrorText(err);}};
    });
}
function openHow(){
  openSheet(`${sheetHead("How Athena scores routes")}
    <p><b style="color:var(--ink)">OpenTripPlanner plans the routes.</b> Each search runs twice per way of travelling: once with walk safety off, which gives the plain fastest route, and once with it on. With safety on, OTP's Athena tag mapper makes unlit and higher-risk streets cost more, so it prefers lit, busier ones.</p>
    <p><b style="color:var(--ink)">Athena then scores what OTP returns.</b> Every 15 m of walking or riding is matched to the nearest scored street for the chosen time of night. A street's score combines lighting (City of Sydney poles), places open nearby (OpenStreetMap) and suburb crime rates (BOCSAR). Waiting at a stop counts too.</p>
    <div class="code">route risk = 0.55 × time-weighted exposure + 0.45 × worst stretch
exposure  = (street risk × walk/ride time
           + 0.12 × on-board time
           + stop risk × waiting time) ÷ trip time</div>
    <p>This is the rule-based baseline from our proposal. A LightGBM model will replace the street scores later. Routes are described as lower or higher risk, never as safe, and the summary text is written from these facts only.</p>`);
}
function openReport(){
  const cats=["Poorly lit","Isolated or empty","Harassment","Stop or station issue","Something else"];let pick=null;
  openSheet(`${sheetHead("Report an issue")}<p>Reports are anonymous. A moderator removes personal or prejudiced content, and a person checks anything flagged before it affects routes.</p>
    <div class="choices" id="cats">${cats.map(c=>`<button class="choice" aria-pressed="false" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="field"><label for="rep-note">Anything to add? (optional)</label><textarea id="rep-note" placeholder="For example: two lights out near the stop"></textarea></div>
    <button class="btn primary" id="rep-send" disabled>Send report</button>`,s=>{
      s.querySelector("#cats").onclick=ev=>{const b=ev.target.closest("[data-cat]");if(!b)return;pick=b.dataset.cat;s.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x===b));s.querySelector("#rep-send").disabled=false;};
      s.querySelector("#rep-send").onclick=()=>{closeSheet();toast(`Report noted: ${pick}. This demo keeps it on your device only.`);};});
}
function openRating(){
  let n=0;
  openSheet(`${sheetHead("How did that trip feel?")}<p>Rate how safe you felt. Ratings are stored without your name or location and help retrain the risk model.</p>
    <div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<button class="star" aria-pressed="false" data-n="${i}" aria-label="${i} out of 5">${icon("star")}</button>`).join("")}</div>
    <button class="btn primary" id="rate-send" disabled>Send rating</button>`,s=>{
      s.querySelector("#stars").onclick=ev=>{const b=ev.target.closest("[data-n]");if(!b)return;n=+b.dataset.n;s.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.n<=n));s.querySelector("#rate-send").disabled=false;};
      s.querySelector("#rate-send").onclick=()=>{closeSheet();toast(`Thanks. You rated this trip ${n} out of 5 (demo only, nothing was sent).`);};});
}
function openSos(){
  openSheet(`${sheetHead("Emergency")}<p>If you're in danger, call <b style="color:var(--ink);font-size:20px;user-select:all">000</b> from your phone. For police assistance that isn't urgent, call <b style="color:var(--ink);user-select:all">131 444</b>.</p>
    <p>Staffed stations and busy, lit streets are the best places to wait for help. Athena shows them on every route.</p>`);
}

// ============================================================ events
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-open]");if(!t)return;
  if(t.dataset.band){S.band=t.dataset.band;persist();refresh(false);}
  else if(t.dataset.mode){const m=t.dataset.mode;S.modes.has(m)?S.modes.delete(m):S.modes.add(m);persist();refresh(false);}
  else if(t.dataset.sel){if(S.trip)return;select(t.dataset.sel);}
  else if(t.dataset.start){startTrip(t.dataset.start);}
  else if(t.dataset.open==="data")openData();
  else if(t.dataset.trip){const a=t.dataset.trip;
    if(a==="toggle"){S.trip.playing=!S.trip.playing;S.trip.last=performance.now();if(S.trip.playing)requestAnimationFrame(tick);renderHud();}
    else if(a==="report")openReport();else if(a==="end")endTrip(true);else if(a==="rate")endTrip(true);else if(a==="close")endTrip(false);}
});
$("from").onchange=e=>{S.from=e.target.value;persist();refresh();};
$("to").onchange=e=>{S.to=e.target.value;persist();refresh();};
$("swap").onclick=()=>{[S.from,S.to]=[S.to,S.from];persist();refresh();};
$("source-btn").onclick=openData;$("how-btn").onclick=openHow;$("sos-btn").onclick=openSos;
$("layer-btn").onclick=()=>{S.layer=!S.layer;$("layer-btn").setAttribute("aria-pressed",S.layer);drawStreets();};
$("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet();});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",retheme);
new MutationObserver(retheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

let resizeT;window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(map&&!S.trip)drawRoutes(true);},250);});
window.athenaDebug=()=>({map,S});
// ============================================================ boot
(async()=>{
  renderControls();S.loading=true;renderList();
  if(window.maplibregl)initMap();else{S.error="The map library didn't load.";}
  await loadSaved();S.loading=false;
  await refresh(true);
})();
})();
</script>

</body></html>
