<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/web/athena.css">
<style>
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

<body>
<header class="topbar">
  <a class="tb-brand" href="/" aria-label="Athena home"><span class="mark" aria-hidden="true">A</span><span class="name">Athena</span></a>
  <nav class="tb-tabs" aria-label="Sections">
    <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a4 4 0 0 0 0-8H8a4 4 0 0 1 0-8h8"/></svg>Plan a trip</a>

<div class="banner"><span><b style="color:var(--ink)">Prototype map, built before the hackathon.</b> Declared pre-existing work, shown here unchanged for comparison.</span><a href="/">Back to the journey planner</a></div>

<iframe src="/web/index.html" title="Athena prototype route map"></iframe>
